<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Support | Cyrus Capital Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap');
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .form-input { width: 100%; padding: 14px 16px; background: #f8fafc; border: 2px solid transparent; border-radius: 16px; font-size: 16px; font-weight: 700; outline: none; transition: 0.3s; }
    .form-input:focus { background: #fff; border-color: #fbbf24; }
    .empty-state { text-align: center; padding: 60px 20px; color: #94a3b8; }
    .empty-state i { font-size: 40px; margin-bottom: 12px; color: #e2e8f0; }
    #app-shell { display: none; height: 100vh; flex-direction: column; }
    .support-top { flex-shrink: 0; background: white; border-bottom: 1px solid #f1f5f9; padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
    .support-body { flex: 1; display: grid; grid-template-columns: 320px 1fr; min-height: 0; }
    .convo-list { border-right: 1px solid #f1f5f9; overflow-y: auto; background: white; padding: 10px; }
    .convo-row { padding: 12px; border-radius: 14px; cursor: pointer; margin-bottom: 4px; }
    .convo-row:hover { background: #f8fafc; }
    .convo-row.active { background: #fef9c3; }
    .convo-name { font-weight: 800; font-size: 13px; color: #0f172a; }
    .convo-preview { font-size: 11px; color: #94a3b8; font-weight: 600; margin-top: 2px; }
    .chat-pane { display: flex; flex-direction: column; min-height: 0; }
    .chat-header { padding: 16px 20px; border-bottom: 1px solid #f1f5f9; font-weight: 800; color: #0f172a; flex-shrink: 0; display: flex; align-items: center; gap: 10px; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; background: #fafaf8; }
    .bubble { max-width: 75%; padding: 10px 14px; border-radius: 14px; font-size: 13px; color: #0f172a; line-height: 1.4; }
    .bubble.user { align-self: flex-start; background: #f1f5f9; }
    .bubble.admin { align-self: flex-end; background: #fef9c3; }
    .bubble img { max-width: 220px; border-radius: 10px; cursor: pointer; display: block; }
    .chat-input-bar { flex-shrink: 0; padding: 14px 16px; border-top: 1px solid #f1f5f9; background: white; display: flex; gap: 8px; align-items: center; }
    .back-btn { display: none; background: none; border: none; color: #94a3b8; font-size: 18px; cursor: pointer; }
    @media (max-width: 800px) {
        .support-body { grid-template-columns: 1fr; }
        .convo-list { display: block; }
        .chat-pane { display: none; }
        .support-body.chat-open .convo-list { display: none; }
        .support-body.chat-open .chat-pane { display: flex; }
        .back-btn { display: inline-block; }
    }
</style>
</head>
<body>

<div id="login-screen" class="min-h-screen flex items-center justify-center px-6">
    <div class="w-full max-w-md">
        <div class="text-center mb-10">
            <div class="w-16 h-16 bg-yellow-400 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-headset text-slate-900 text-2xl"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-900">Support</h1>
            <p class="text-sm font-bold text-slate-400 mt-2">Cyrus Capital Admin</p>
        </div>
        <div class="bg-white p-8 rounded-[2rem] shadow-[0_20px_60px_rgba(0,0,0,0.05)] border border-gray-100">
            <form id="admin-login-form" class="space-y-4">
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1 mb-2 block">Admin Email</label>
                    <input type="email" id="admin-email" placeholder="admin@cyrus.com" required class="form-input">
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1 mb-2 block">Password</label>
                    <input type="password" id="admin-password" required class="form-input">
                </div>
                <button type="submit" id="admin-login-btn" class="w-full py-4 bg-yellow-400 text-slate-900 font-black rounded-xl hover:brightness-105 active:scale-[0.98] transition-all tracking-wider shadow-lg uppercase text-xs">SIGN IN</button>
            </form>
            <p id="login-error" class="text-xs font-bold text-red-500 mt-4 text-center hidden"></p>
        </div>
        <p class="text-center text-xs font-bold text-slate-300 mt-6"><a href="index.html" class="hover:text-slate-500">&larr; Back to dashboard</a></p>
    </div>
</div>

<div id="app-shell">
    <div class="support-top">
        <a href="index.html" class="text-slate-400 hover:text-slate-700" title="Back to dashboard"><i class="fa-solid fa-arrow-left"></i></a>
        <div class="w-9 h-9 bg-yellow-400 rounded-xl flex items-center justify-center flex-shrink-0"><i class="fa-solid fa-headset text-slate-900"></i></div>
        <div>
            <h1 class="font-black text-slate-900 text-sm leading-tight">Support Chats</h1>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Cyrus Capital Admin</p>
        </div>
    </div>
    <div class="support-body" id="support-body">
        <div class="convo-list">
            <input type="text" id="support-conv-search" placeholder="Search by user ID..." oninput="renderSupportConversations()" class="form-input mb-3" style="font-size:13px;">
            <div id="support-conversations-list">
                <div class="empty-state">
                    <i class="fa-solid fa-comments"></i>
                    <p class="font-bold text-sm">Loading conversations...</p>
                </div>
            </div>
        </div>
        <div class="chat-pane">
            <div class="chat-header">
                <button class="back-btn" onclick="closeChatPane()"><i class="fa-solid fa-arrow-left"></i></button>
                <span id="support-chat-header">Select a conversation</span>
            </div>
            <div id="support-chat-messages" class="chat-messages"></div>
            <div class="chat-input-bar">
                <label style="cursor:pointer; color:#94a3b8; padding:8px;">
                    <i class="fa-solid fa-paperclip"></i>
                    <input type="file" id="support-image-input" accept="image/*" class="hidden" onchange="sendSupportImage(this)">
                </label>
                <input type="text" id="support-reply-input" placeholder="Type a reply..." class="form-input flex-1" style="font-size:13px;" onkeydown="if(event.key==='Enter')sendSupportReply()">
                <button onclick="sendSupportReply()" class="px-5 py-3 bg-yellow-400 text-slate-900 rounded-xl font-black text-xs uppercase tracking-wider hover:brightness-105 transition-all flex-shrink-0">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>
</div>

<div id="image-modal" class="fixed inset-0 bg-black/80 z-[9999] hidden items-center justify-center p-4" onclick="this.style.display='none'">
    <img id="image-modal-img" src="" alt="Preview" class="max-w-full max-h-[90vh] rounded-2xl shadow-2xl">
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBrpzFcShlTEluT6McutQYyQk38kY63iIc",
        authDomain: "cyrus-project-01.firebaseapp.com",
        projectId: "cyrus-project-01",
        storageBucket: "cyrus-project-01.firebasestorage.app",
        messagingSenderId: "311717930259",
        appId: "1:311717930259:web:740716507764d6b4bca6e6"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // Support chat lives on a separate Firebase project (used by cyruschat.vercel.app)
    const supportChatConfig = {
        apiKey: "AIzaSyDYZxfER-KfThiRp9MLu869aDrjX9BDOqs",
        databaseURL: "https://forexquest-fbcac-default-rtdb.firebaseio.com/",
        projectId: "forexquest-fbcac"
    };
    const chatDb = firebase.initializeApp(supportChatConfig, "supportChatApp").database();
    const IMGBB_API_KEY = "161f4ec439942b5690f5207ba9fdc277";

    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('admin-login-btn');
        const errorEl = document.getElementById('login-error');
        errorEl.classList.add('hidden');
        btn.innerText = "AUTHENTICATING...";
        btn.disabled = true;
        try {
            const cred = await auth.signInWithEmailAndPassword(
                document.getElementById('admin-email').value,
                document.getElementById('admin-password').value
            );
            const adminDoc = await db.collection("admins").doc(cred.user.uid).get();
            if (!adminDoc.exists) {
                await auth.signOut();
                errorEl.innerText = "Access denied. Admin privileges required.";
                errorEl.classList.remove('hidden');
                btn.innerText = "SIGN IN"; btn.disabled = false;
                return;
            }
        } catch (err) {
            errorEl.innerText = "Login failed: " + err.message;
            errorEl.classList.remove('hidden');
            btn.innerText = "SIGN IN"; btn.disabled = false;
        }
    });

    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-shell').style.display = 'flex';
            initSupportConversations();
        } else {
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('app-shell').style.display = 'none';
        }
    });

    let allSupportConversations = [];
    let currentSupportUserId = null;
    let currentSupportMessagesRef = null;

    function initSupportConversations() {
        chatDb.ref('support_chats').on('value', snap => {
            const data = snap.val() || {};
            allSupportConversations = Object.keys(data).map(userId => {
                const messages = Object.values(data[userId] || {});
                const last = messages.sort((a, b) => (a.time || 0) - (b.time || 0)).pop() || {};
                return { userId, lastText: last.text || '', lastType: last.type || 'text', lastTime: last.time || 0, lastSender: last.sender || 'user' };
            }).sort((a, b) => b.lastTime - a.lastTime);
            renderSupportConversations();
        });
    }

    function renderSupportConversations() {
        const container = document.getElementById('support-conversations-list');
        const searchTerm = (document.getElementById('support-conv-search').value || '').toLowerCase();
        let convos = allSupportConversations;
        if (searchTerm) convos = convos.filter(c => c.userId.toLowerCase().includes(searchTerm));
        if (convos.length === 0) {
            container.innerHTML = '<div class="empty-state"><i class="fa-solid fa-comments"></i><p class="font-bold text-sm">No conversations yet.</p></div>';
            return;
        }
        container.innerHTML = convos.map(c => {
            const preview = c.lastType === 'image' ? '📷 Image' : (c.lastText || '').substring(0, 40);
            const active = c.userId === currentSupportUserId ? ' active' : '';
            return '<div class="convo-row' + active + '" onclick="openSupportConversation(\'' + c.userId + '\')">' +
                '<p class="convo-name">' + c.userId + '</p>' +
                '<p class="convo-preview">' + (c.lastSender === 'user' ? '' : '&#8617; ') + preview + '</p></div>';
        }).join('');
    }

    function openSupportConversation(userId) {
        currentSupportUserId = userId;
        document.getElementById('support-chat-header').innerText = userId;
        document.getElementById('support-body').classList.add('chat-open');
        renderSupportConversations();
        if (currentSupportMessagesRef) currentSupportMessagesRef.off();
        const messagesBox = document.getElementById('support-chat-messages');
        messagesBox.innerHTML = '';
        currentSupportMessagesRef = chatDb.ref('support_chats/' + userId);
        currentSupportMessagesRef.on('child_added', snap => {
            const data = snap.val();
            if (!data || data.type === 'close_session' || data.type === 'rating_result') return;
            const isUser = data.sender === 'user';
            const bubble = document.createElement('div');
            bubble.className = 'bubble ' + (isUser ? 'user' : 'admin');
            if (data.type === 'image') {
                const img = document.createElement('img');
                img.src = data.text;
                img.onclick = () => openImageModal(data.text);
                bubble.appendChild(img);
            } else {
                bubble.innerText = data.text || '';
            }
            messagesBox.appendChild(bubble);
            messagesBox.scrollTop = messagesBox.scrollHeight;
        });
    }

    function closeChatPane() {
        document.getElementById('support-body').classList.remove('chat-open');
    }

    function sendSupportReply() {
        const input = document.getElementById('support-reply-input');
        const text = input.value.trim();
        if (!text || !currentSupportUserId) return;
        chatDb.ref('support_chats/' + currentSupportUserId).push({ sender: 'admin', text: text, type: 'text', time: Date.now() });
        input.value = '';
    }

    async function sendSupportImage(inputEl) {
        if (!currentSupportUserId) return;
        const file = inputEl.files && inputEl.files[0];
        if (!file) return;
        try {
            const formData = new FormData();
            formData.append("image", file);
            const res = await fetch('https://api.imgbb.com/1/upload?key=' + IMGBB_API_KEY, { method: "POST", body: formData });
            const json = await res.json();
            if (!json.success) throw new Error(json.error ? json.error.message : 'Upload failed');
            chatDb.ref('support_chats/' + currentSupportUserId).push({ sender: 'admin', text: json.data.url, type: 'image', time: Date.now() });
        } catch (err) {
            alert("Image upload failed: " + err.message);
        } finally {
            inputEl.value = '';
        }
    }

    function openImageModal(url) {
        document.getElementById('image-modal-img').src = url;
        document.getElementById('image-modal').style.display = 'flex';
    }

    window.renderSupportConversations = renderSupportConversations;
    window.openSupportConversation = openSupportConversation;
    window.closeChatPane = closeChatPane;
    window.sendSupportReply = sendSupportReply;
    window.sendSupportImage = sendSupportImage;
</script>
</body>
</html>
